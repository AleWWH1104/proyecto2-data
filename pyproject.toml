[project]
name = "proyecto2-data"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ayalaSL", email = "iris@softlogic.com" }
]
requires-python = ">=3.11"
dependencies = [
    "albumentations>=2.0.8",
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.1",
    "numpy>=2.4.6",
    "opencv-python-headless>=5.0.0.93",
    "pandas>=3.0.5",
    "plotly>=7.1.0",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "segmentation-models-pytorch>=0.5.0",
    "streamlit>=1.65.0",
    "tifffile>=2026.3.3",
    "torch>=2.14.0",
    "transformers>=5.17.0",
]

[tool.uv]
package = false

# En Windows el wheel de torch de PyPI es CPU-only, así que el perfil operativo
# (CUDA en Windows nativo) no se puede cumplir con el índice por defecto. Se fija
# el índice cu130 de PyTorch solo para Windows. macOS usa PyPI, que publica
# wheels para Apple Silicon. Se conserva torchvision desde PyPI, como en el
# lock anterior: la asignación de una dependencia solo transitiva no se aplicaba.
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32'" }]
